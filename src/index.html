<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8f4">
    <meta name="description" content="登山安全島：以互動立體島嶼探索行前準備、登山知識與安全協作。">
    <title>登山安全島｜Mountain Safety Island</title>
</head>
<body>
    <main id="world" aria-label="登山安全島互動場景">
        <canvas class="webgl" aria-label="拖曳旋轉、滾輪或雙指縮放 3D 島群"></canvas>
    </main>
    <header class="island-brand">
        <p class="eyebrow">MOUNTAIN SAFETY ISLAND</p>
        <h1>登山安全島</h1>
        <p>每一份準備，連起平安回家的路。</p>
        <p class="stage">日夜探索 · 建物與細項互動尚未開放</p>
    </header>
    <nav class="scene-tools" aria-label="鏡頭工具"><button id="overview" type="button">⌂ 全景</button></nav>
    <details class="time-panel" aria-label="日夜時間控制" open>
        <summary>◷ 時間 <span id="compact-time">10:00</span></summary>
        <div class="time-content">
        <div class="time-heading"><span>島嶼時間</span><time id="island-time" datetime="10:00">10:00</time><span id="time-state">自動播放</span></div>
        <div id="time-presets" class="time-presets"></div>
        <label class="time-slider">時間軸<input id="time-slider" type="range" min="0" max="1439" step="1" value="600" aria-label="島嶼時間"></label>
        <button id="pause-time" type="button" aria-pressed="false">Ⅱ 暫停</button>
        <p id="motion-note" hidden>已依減少動態效果設定停止自動播放；仍可手動選擇時間。</p>
        </div>
    </details>
    <div class="scene-hint">拖曳旋轉 · 滾輪或雙指縮放<span id="scene-stats"></span></div>
    <div id="loading" class="loading" role="status" aria-live="polite"><h2>正在組合登山安全島…</h2><p>準備天空、水面與十二座主題島。</p></div>
    <noscript><p class="no-script">請啟用 JavaScript，以瀏覽登山安全島互動場景。</p></noscript>
</body>
</html>
