<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8f4">
    <meta name="description" content="登山安全島：以互動立體島嶼探索行前準備、登山知識與安全協作。">
    <title>登山安全島｜Mountain Safety Island</title>
    <style>
        body { background: radial-gradient(ellipse at top, #fffdf9, #edddcf); }
        .island-brand { position: fixed; top: 24px; left: 24px; z-index: 1; max-width: calc(100vw - 96px); padding: 20px 24px; border: 1px solid #ffffffb3; border-radius: 18px; background: #fff8f4e6; box-shadow: 0 8px 32px #4a2a1414; backdrop-filter: blur(16px); color: #211d1d; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; pointer-events: none; }
        .island-brand p { margin: 0; font-size: 13px; line-height: 1.8; }
        .island-brand .eyebrow { color: #71806a; font: 700 10px ui-monospace, monospace; letter-spacing: 2px; }
        .island-brand h1 { margin: 8px 0; font-size: 28px; }
        .island-brand .stage { margin-top: 10px; color: #786c62; font-size: 12px; }
        .no-script { position: fixed; bottom: 24px; left: 24px; z-index: 2; padding: 16px; background: #fff8f4; color: #211d1d; }
        @media (max-width: 800px) { .island-brand { top: 16px; left: 16px; padding: 16px; } .island-brand h1 { font-size: 24px; } }
    </style>
</head>
<body>
    <canvas class="webgl" aria-label="登山安全島 3D 場景"></canvas>
    <header class="island-brand">
        <p class="eyebrow">MOUNTAIN SAFETY ISLAND</p>
        <h1>登山安全島</h1>
        <p>每一份準備，連起平安回家的路。</p>
        <p class="stage">建置中 · 目前顯示 Three.js 測試場景</p>
    </header>
    <noscript><p class="no-script">請啟用 JavaScript，以瀏覽登山安全島互動場景。</p></noscript>
    <!-- Webpack 會自動注入 src/script.js 打包後的程式。 -->
</body>
</html>
